[package]
name = "ide-shell"
version = "0.1.0"
description = "AROMA IDE"
edition = "2021"
rust-version = "1.77"
authors = ["Roman Agafonov <diecorporationsdie@gmail.com>"]
license-file = "../LICENSE"

[package.metadata]
donate = "https://pay.cloudtips.ru/p/1cc0e1e4"

[lib]
name = "ide_shell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.8"
