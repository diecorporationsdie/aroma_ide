[package]
name = "ide-shell"
version = "0.1.0"
description = "AROMA IDE"
edition = "2021"
rust-version = "1.77"
authors = ["Roman Agafonov <diecorporationsdie@gmail.com>"]
license-file = "../LICENSE"

[package.metadata]
donate = "https://pay.cloudtips.ru/p/1cc0e1e4"

[lib]
name = "ide_shell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.8"

# Наблюдение за файловой системой: горячая перезагрузка плагинов, live-reload
# проектов, реакция на файлы, которые пишут внешние тулчейны.
notify = "8"
# Бинарные данные через IPC: картинки, PDF, прошивки, гербера, ассеты.
base64 = "0.22"
# Поиск по проекту: IDE без grep — не IDE.
regex = "1"
# Мьютексы без отравления: паника в одном обработчике не должна навсегда
# ломать терминал или хранилище.
parking_lot = "0.12"
# Логи в файл: без них жалобы «ничего не работает» неотлаживаемы.
log = "0.4"
# Порты для контроллеров: прошивка, мониторинг, обмен с платой.
serialport = "4"

# --- Профили сборки ---------------------------------------------------------
# Зависимости в dev собираем с оптимизацией: IDE заметно быстрее, инкремент
# нашего крейта остаётся быстрым (меняется только наш код).
[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
